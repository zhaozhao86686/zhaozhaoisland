<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>走丢啦 · 赵赵的岛</title>
<link rel="stylesheet" href="fonts.css?v=1" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Baloo 2", "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-synthesis: none;
    background: #C6E7F6;
    color: #1C2836;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 18px;
    text-align: center;
    line-height: 1.85;
  }
  .card {
    background: #FFFBE9;
    border: 4px solid #1C2836;
    border-radius: 26px;
    box-shadow: 8px 8px 0 rgba(20, 34, 50, .18);
    padding: 40px 34px;
    max-width: 520px;
    width: 100%;
  }
  .code {
    font-family: "Baloo 2", sans-serif;
    font-size: 4.2rem;
    line-height: 1.1;
    color: #FFD90F;
    -webkit-text-stroke: 3px #1C2836;
    text-stroke: 3px #1C2836;
    letter-spacing: .06em;
  }
  h1 { font-size: 1.5rem; font-weight: 400; letter-spacing: .07em; margin: 10px 0 6px; }
  p { color: #5b6678; font-size: .98rem; margin-bottom: 22px; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 14px;
    border: 3px solid #1C2836;
    background: #FFD90F;
    color: #1C2836;
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: .06em;
    text-decoration: none;
    box-shadow: 4px 4px 0 rgba(20, 34, 50, .18);
    transition: transform .15s, box-shadow .15s;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px) rotate(-1.5deg); box-shadow: 6px 7px 0 rgba(20, 34, 50, .2); }
  .dog { font-size: 2.4rem; line-height: 1; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="dog">🐶</div>
    <div class="code">404</div>
    <h1>这个页面跑到别处玩去了</h1>
    <p>你要找的页面不在岛上，可能地址打错了，或者它已经被搬走啦。</p>
    <a class="btn" href="/">回岛上看看 →</a>
  </div>
</body>
</html>
